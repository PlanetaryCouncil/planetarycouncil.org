document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ransparent),color-mix(in oklab, var(--bg) 75%, transparent));padding:28px;display:flex;flex-direction:column;gap:22px;clip-path:polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px))\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;border-bottom:1px solid color-mix(in oklab, var(--accent) 25%, transparent);padding-bottom:16px\">\n          <div>\n            <div style=\"font-family:'Chakra Petch',sans-serif;font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:var(--accent)\">Planetary Council · sealed ballot<\u002Fdiv>\n            <div style=\"font-family:'Chakra Petch',sans-serif;font-size:26px;color:var(--text);text-transform:uppercase;margin-top:6px\">Twenty questions<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase\">Card {{ cardId }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(10,auto);gap:7px 30px\">\n          <sc-for list=\"{{ cardRows }}\" as=\"row\" hint-placeholder-count=\"20\">\n            <div style=\"display:grid;grid-template-columns:24px 20px 1fr;gap:10px;align-items:center\">\n              <span style=\"font-family:'Chakra Petch',sans-serif;font-size:13px;color:var(--accent3);text-align:right\">{{ row.n }}<\u002Fspan>\n              <span style=\"font-size:14px;line-height:1;text-align:center\">{{ row.icon }}<\u002Fspan>\n              <span style=\"font-size:15px;line-height:1.25;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ row.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"border-top:1px solid color-mix(in oklab, var(--accent) 25%, transparent);padding-top:18px;text-align:center\">\n          <div style=\"font-family:'Chakra Petch',sans-serif;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)\">this card was completed<\u002Fdiv>\n          <div style=\"font-family:'Chakra Petch',sans-serif;font-size:clamp(18px,2.6vw,26px);color:var(--text);margin-top:6px\">{{ stamp }}<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.12em;color:var(--muted);margin-top:4px\">PAD {{ padId }} · SEAL {{ cardId }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:auto 1px 1fr;gap:22px;align-items:center;border:1px solid color-mix(in oklab, var(--accent) 35%, transparent);padding:18px;background:color-mix(in oklab, var(--bg) 55%, transparent)\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;align-items:center\">\n            <div ref=\"{{ qrRef }}\" style=\"width:132px;height:132px;background:#fff;padding:8px;box-sizing:border-box;display:grid\"><\u002Fdiv>\n            <span style=\"font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.02em;color:var(--text)\">PlanetaryCouncil.org/vote<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:100%;background:color-mix(in oklab, var(--accent) 25%, transparent)\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:grid;grid-template-columns:repeat(20,1fr);gap:3px\">\n              <sc-for list=\"{{ cipher }}\" as=\"c\" hint-placeholder-count=\"100\">\n                <div style=\"aspect-ratio:1;background:{{ c.bg }}\"><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <span style=\"font-size:14px;color:var(--muted);text-align:center\">answers encoded with a one-time pad · revealed when enough of us vote<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;background:var(--accent2);padding:16px 22px\">\n          <span style=\"font-family:'Chakra Petch',sans-serif;font-size:clamp(15px,2vw,20px);font-weight:700;color:var(--onAccent);letter-spacing:.02em\">Inspired by change? Share it.<\u002Fspan>\n          <a href=\"https://planetarycouncil.org/vote/\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Chakra Petch',sans-serif;font-size:clamp(15px,2vw,20px);font-weight:700;color:var(--onAccent);text-decoration:underline\">PlanetaryCouncil.org/vote<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-family:'Chakra Petch',sans-serif;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)\">Also on the ballot<\u002Fdiv>\n\n      <div sc-camel-on-click=\"{{ toggleClacton }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:16px;padding:16px 20px;border:1px solid color-mix(in oklab, var(--accent) 32%, transparent);background:color-mix(in oklab, var(--panel) 40%, transparent)\" style-hover=\"border-color:color-mix(in oklab, var(--accent) 50%, transparent)\">\n        <span style=\"font-family:'Chakra Petch',sans-serif;font-size:15px;color:var(--text);letter-spacing:.04em;flex:1\">Count Binface — Clean Up Clacton <span style=\"color:var(--muted)\">· 20 pledges<\u002Fspan><\u002Fspan>\n        <span style=\"color:var(--accent);font-size:20px;line-height:1\">{{ clactonCaret }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ clactonOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;padding:6px 0 10px\">\n          <sc-for list=\"{{ clacton }}\" as=\"item\" hint-placeholder-count=\"20\">\n            <div sc-camel-on-click=\"{{ item.toggle }}\" style=\"cursor:pointer;display:grid;grid-template-columns:44px 1fr 40px;gap:14px;align-items:center;background:color-mix(in oklab, var(--panel) 30%, transparent);border:1px solid color-mix(in oklab, var(--accent) 24%, transparent);padding:11px 16px\" style-hover=\"border-color:color-mix(in oklab, var(--accent) 45%, transparent)\">\n              <span style=\"font-family:'Chakra Petch',sans-serif;font-size:19px;font-weight:600;color:var(--muted);text-align:center;line-height:1\">{{ item.n }}<\u002Fspan>\n              <span style=\"font-size:17px;line-height:1.35;color:var(--text);text-wrap:pretty\">{{ item.text }}<\u002Fspan>\n              <div style=\"width:24px;height:24px;border:2px solid color-mix(in oklab, var(--accent3) 55%, transparent);display:flex;align-items:center;justify-content:center;justify-self:center\">\n                <sc-if value=\"{{ item.on }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"width:14px;height:14px;background:var(--accent);box-shadow:0 0 12px var(--accent)\"><\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div sc-camel-on-click=\"{{ toggleClassics }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:16px;padding:16px 20px;border:1px solid color-mix(in oklab, var(--accent) 32%, transparent);background:color-mix(in oklab, var(--panel) 40%, transparent)\" style-hover=\"border-color:color-mix(in oklab, var(--accent) 50%, transparent)\">\n        <span style=\"font-family:'Chakra Petch',sans-serif;font-size:15px;color:var(--text);letter-spacing:.04em;flex:1\">The classics <span style=\"color:var(--muted)\">· previous manifestos<\u002Fspan><\u002Fspan>\n        <span style=\"color:var(--accent);font-size:20px;line-height:1\">{{ classicsCaret }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ classicsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div sc-camel-on-click=\"{{ toggleLegacy }}\" style=\"cursor:pointer;display:grid;grid-template-columns:1fr 40px;gap:14px;align-items:center;background:color-mix(in oklab, var(--panel) 30%, transparent);border:1px solid color-mix(in oklab, var(--accent) 24%, transparent);padding:18px 20px\">\n          <ul style=\"margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 24px;font-size:17px;color:var(--text)\">\n            <sc-for list=\"{{ legacy }}\" as=\"line\" hint-placeholder-count=\"6\">\n              <li style=\"display:flex;gap:9px;align-items:flex-start\"><span style=\"color:#475569\">▪<\u002Fspan><span>{{ line }}<\u002Fspan><\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n          <div style=\"width:24px;height:24px;border:2px solid color-mix(in oklab, var(--accent3) 55%, transparent);display:flex;align-items:center;justify-content:center;justify-self:center\">\n            <sc-if value=\"{{ legacyOn }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"width:14px;height:14px;background:var(--accent);box-shadow:0 0 12px var(--accent)\"><\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ debug }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;right:16px;bottom:16px;z-index:80;width:264px;background:rgba(2,4,10,.94);border:1px solid color-mix(in oklab, var(--accent) 45%, transparent);padding:14px;font-family:'Chakra Petch',sans-serif;backdrop-filter:blur(8px)\">\n      <div sc-camel-on-click=\"{{ togglePanel }}\" style=\"cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)\">\n        <span>Palette debug<\u002Fspan><span>{{ panelCaret }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ panelOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:12px\">\n          <div style=\"display:flex;gap:6px\">\n            <button sc-camel-on-click=\"{{ shuffle }}\" style=\"flex:1;cursor:pointer;font-family:'Chakra Petch',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:9px;background:var(--accent);color:var(--onAccent);border:0;font-weight:700\">Nudge 20%<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ shuffleWild }}\" style=\"cursor:pointer;font-family:'Chakra Petch',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:9px 11px;background:transparent;color:var(--muted);border:1px solid color-mix(in oklab, var(--accent) 40%, transparent)\">Wild<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ resetTheme }}\" style=\"cursor:pointer;font-family:'Chakra Petch',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:9px 12px;background:transparent;color:var(--muted);border:1px solid color-mix(in oklab, var(--accent) 40%, transparent)\">Default<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(9,1fr);gap:3px\">\n            <sc-for list=\"{{ swatches }}\" as=\"sw\" hint-placeholder-count=\"9\">\n              <div title=\"{{ sw.name }}\" style=\"height:22px;background:{{ sw.value }};border:1px solid rgba(255,255,255,.14)\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <textarea sc-camel-read-only=\"{{ true }}\" value=\"{{ themeJson }}\" sc-camel-on-click=\"{{ selectAll }}\" style=\"width:100%;height:132px;box-sizing:border-box;background:#000;color:#7dd3fc;border:1px solid rgba(255,255,255,.14);font-family:ui-monospace,monospace;font-size:10px;line-height:1.45;padding:8px;resize:vertical\"><\u002Ftextarea>\n          <div style=\"font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase\">Seed {{ seed }} · paste JSON in chat to save<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <footer style=\"text-align:center;font-family:'Chakra Petch',sans-serif;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent2);opacity:.65\">Planetary Council .org<\u002Ffooter>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst UK = [\n  [\"🗳️\", \"Proportional representation\", \"Seats in parliament should match the share of votes cast.\"],\n  [\"⚡\", \"Public ownership\", \"Energy, water and rail run at cost, not for dividends.\"],\n  [\"🚆\", \"Rail automation\", \"Trains drive themselves; drivers become on-board managers.\"],\n  [\"📶\", \"Connectivity as infrastructure\", \"5G and broadband treated like roads and water.\"],\n  [\"🌍\", \"Climate resilience\", \"Fund adaptation now, alongside the clean energy transition.\"],\n  [\"🛡️\", \"Lower military spending\", \"Shift the budget from deterrence to resilience.\"],\n  [\"🕊️\", \"Stop arms production\", \"End the exports that keep other people's wars running.\"],\n  [\"🏛️\", \"Redesign the Commons\", \"A horseshoe chamber instead of two rows shouting.\"],\n  [\"👥\", \"Elect the second chamber\", \"Replace the House of Lords with elected representatives.\"],\n  [\"🇪🇺\", \"Rejoin the Single Market\", \"Trade, travel and study without the friction.\"]\n];\n\nconst WORLD = [\n  [\"🤝\", \"Unify humanity\", \"One shared set of facts to start any argument from.\"],\n  [\"🔎\", \"Resolve conspiracy theories\", \"Settle them openly, starting with climate change.\"],\n  [\"💰\", \"A full-cost economy\", \"Prices that include externalities and long-term consequences.\"],\n  [\"☮️\", \"End all wars\", \"Including the war on drugs.\"],\n  [\"🔧\", \"Repurpose military tech\", \"From destruction to planetary regeneration.\"],\n  [\"🤖\", \"Turn AI disruption into work\", \"Redeploy displaced labour into climate adaptation.\"],\n  [\"🔌\", \"A global energy grid\", \"Linked continents, with worldwide CO₂ emissions trading.\"],\n  [\"🛰️\", \"Connect everyone\", \"Global internet, satellite access and on-device AI for all.\"],\n  [\"📰\", \"Media that informs\", \"Truth over outrage, clarity over polarisation.\"],\n  [\"🏦\", \"End tax havens\", \"No bank secrecy, no offshore hiding, one simple framework.\"]\n];\n\nconst CLACTON = [\n  \"Boost the region's economy, prestige and fame.\",\n  \"Cut your taxes, and raise everyone else's.\",\n  \"Bus fares capped at £1.99, and 99 Flakes at no more than 99p.\",\n  \"Spend more time in Clacton-on-Sea than in Washington DC.\",\n  \"MPs who resign mid-parliament barred from the resulting by-election.\",\n  \"MPs who change party mid-parliament forced to face a by-election.\",\n  \"Build at least one affordable house.\",\n  \"Arcade grabber games made fair enough to actually win.\",\n  \"Oil and gas companies to pay for solar panels for everyone. (Jack, aged 10)\",\n  \"Regenerate Walton Pier, so it's as great as Clacton Pier.\",\n  \"A windfall tax on cosy crime novels 'written' by celebrities.\",\n  \"Potholes filled using copies of the 2024 Labour Party Manifesto.\",\n  \"Parliament moved to the Bin HQ in Weeley while Westminster is restored.\",\n  \"Annoyingly loud exhausts past Clacton station to lose their licence.\",\n  \"No £5 million gifts from crypto billionaires (on Earth).\",\n  \"A referendum on whether Pluto should regain planet status.\",\n  \"The hand-dryer at the Great Himalayas, Southport, to be repositioned.\",\n  \"Wayne Rooney as the BBC's expert summariser at Eurovision.\",\n  \"Count Binface at Eurovision 2027, Clacton hosting 2028.\",\n  \"I stand by my past manifestos. I've got it covered.\"\n];\n\nconst LEGACY = [\n  \"Ceefax to be restored\",\n  \"Adele to be nationalised\",\n  \"HS2 to be renamed FFS1\",\n  \"Speakerphones in public outlawed\",\n  \"The hand-dryer at the Crown & Treaty fixed\",\n  \"The price of a Freddo capped at 10p\"\n];\n\nconst SCALE = [\n  { v: 2,  mark: \"++\", label: \"Strongly agree\",    color: \"var(--accent)\" },\n  { v: 1,  mark: \"+\",  label: \"Agree\",             color: \"var(--accent3)\" },\n  { v: 0,  mark: \"·\",  label: \"Neutral\",           color: \"#94a3b8\" },\n  { v: -1, mark: \"−\",  label: \"Disagree\",          color: \"#f59e0b\" },\n  { v: -2, mark: \"−−\", label: \"Strongly disagree\", color: \"#f43f5e\" }\n];\n\nconst TOTAL = UK.length + WORLD.length;\n\nconst VARS = [\"bg\",\"bg2\",\"panel\",\"grid\",\"accent\",\"accent2\",\"accent3\",\"text\",\"muted\",\"onAccent\",\"accentDark\"];\n\nconst DEFAULT_THEME = {\n  bg:\"#dcf0fa\", bg2:\"#a9d9f0\", panel:\"#ffbdbd\", grid:\"#46b7e5\",\n  accent:\"#fd868a\", accent2:\"#ffba63\", accent3:\"#e5565f\",\n  text:\"#211314\", muted:\"#743d3f\", onAccent:\"#1d1212\", accentDark:\"#ae3640\"\n};\n\nfunction hex(l, c, h) {\n  // oklch -> sRGB hex\n  const a = c * Math.cos(h * Math.PI / 180), b = c * Math.sin(h * Math.PI / 180);\n  const l_ = l + 0.3963377774 * a + 0.2158037573 * b;\n  const m_ = l - 0.1055613458 * a - 0.0638541728 * b;\n  const s_ = l - 0.0894841775 * a - 1.2914855480 * b;\n  const L = l_ ** 3, M = m_ ** 3, S = s_ ** 3;\n  const rgb = [\n    4.0767416621 * L - 3.3077115913 * M + 0.2309699292 * S,\n    -1.2684380046 * L + 2.6097574011 * M - 0.3413193965 * S,\n    -0.0041960863 * L - 0.7034186147 * M + 1.7076147010 * S\n  ].map(v => {\n    const s = v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(Math.max(v, 0), 1 / 2.4) - 0.055;\n    return Math.round(Math.min(1, Math.max(0, s)) * 255).toString(16).padStart(2, \"0\");\n  });\n  return \"#\" + rgb.join(\"\");\n}\n\nfunction hexToRgb(h) {\n  return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));\n}\n\n// Nudge the baseline palette by `amt` (0-1) — hue drift + light jitter,\n// keeping the coral/sky character intact.\nfunction nudgeTheme(seed, amt) {\n  let x = seed || 1;\n  const rnd = () => (x = (x * 1664525 + 1013904223) % 4294967296) / 4294967296;\n  const dh = (rnd() * 2 - 1) * 60 * amt;\n  const out = {};\n  Object.keys(DEFAULT_THEME).forEach(k => {\n    const [r, g, b] = hexToRgb(DEFAULT_THEME[k]);\n    // rgb -> hsl\n    const mx = Math.max(r, g, b) / 255, mn = Math.min(r, g, b) / 255;\n    const l = (mx + mn) / 2, d = mx - mn;\n    let s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1)), h = 0;\n    if (d) {\n      const rr = r / 255, gg = g / 255, bb = b / 255;\n      h = mx === rr ? ((gg - bb) / d) % 6 : mx === gg ? (bb - rr) / d + 2 : (rr - gg) / d + 4;\n      h *= 60; if (h < 0) h += 360;\n    }\n    const nh = (h + dh + 360) % 360;\n    const ns = Math.min(1, Math.max(0, s * (1 + (rnd() * 2 - 1) * 0.5 * amt)));\n    const nl = Math.min(1, Math.max(0, l + (rnd() * 2 - 1) * 0.12 * amt));\n    // hsl -> rgb\n    const c = (1 - Math.abs(2 * nl - 1)) * ns, hp = nh / 60, m = nl - c / 2;\n    const xx = c * (1 - Math.abs(hp % 2 - 1));\n    const t = hp < 1 ? [c, xx, 0] : hp < 2 ? [xx, c, 0] : hp < 3 ? [0, c, xx]\n      : hp < 4 ? [0, xx, c] : hp < 5 ? [xx, 0, c] : [c, 0, xx];\n    out[k] = \"#\" + t.map(v => Math.round((v + m) * 255).toString(16).padStart(2, \"0\")).join(\"\");\n  });\n  return out;\n}\n\nfunction makeTheme(seed) {\n  let x = seed;\n  const rnd = () => (x = (x * 1664525 + 1013904223) % 4294967296) / 4294967296;\n  const h = Math.floor(rnd() * 360);\n  const h2 = (h + 20 + rnd() * 40) % 360;\n  const hBg = (h + 180 + rnd() * 60) % 360;\n  const dark = rnd() > 0.12;\n  const bgL = dark ? 0.10 + rnd() * 0.05 : 0.95;\n  return {\n    bg: hex(bgL, 0.02, hBg),\n    bg2: hex(bgL + (dark ? 0.14 : -0.1), 0.06, hBg),\n    panel: hex(bgL + (dark ? 0.12 : -0.08), 0.07, h),\n    grid: hex(dark ? 0.38 : 0.7, 0.12, hBg),\n    accent: hex(0.78, 0.16, h),\n    accent2: hex(0.86, 0.13, h2),\n    accent3: hex(0.66, 0.17, h),\n    text: hex(dark ? 0.97 : 0.2, 0.02, h),\n    muted: hex(dark ? 0.78 : 0.42, 0.07, h),\n    onAccent: hex(0.15, 0.03, h),\n    accentDark: hex(0.52, 0.17, h)\n  };\n}\n\nclass Component extends DCLogic {\n  state = {\n    vote: {}, on: {}, clactonOpen: false, classicsOpen: false,\n    panelOpen: false,\n    debug: typeof location !== \"undefined\" && (location.hash === \"#palette\" || location.search.indexOf(\"palette\") > -1),\n    seed: 0, theme: DEFAULT_THEME,\n    pad: Array.from({ length: 100 }, () => Math.floor(Math.random() * 256))\n  };\n\n  applyTheme() {\n    const r = document.documentElement.style;\n    VARS.forEach(k => r.setProperty(\"--\" + k, this.state.theme[k]));\n  }\n  componentDidMount() { this.applyTheme(); this.drawQR(); }\n  componentDidUpdate() { this.applyTheme(); this.drawQR(); }\n\n  pick(key, v) {\n    this.setState(s => {\n      const vote = Object.assign({}, s.vote);\n      if (vote[key] === v) delete vote[key]; else vote[key] = v;\n      return { vote };\n    });\n  }\n\n  buildQs(prefix, list) {\n    return list.map((q, i) => {\n      const key = prefix + i;\n      const cur = this.state.vote[key];\n      return {\n        n: String(i + 1),\n        icon: q[0],\n        title: q[1],\n        text: q[2],\n        opts: SCALE.map(s => {\n          const sel = cur === s.v;\n          return {\n            mark: s.mark,\n            label: s.label,\n            pick: () => this.pick(key, s.v),\n            bg: sel ? s.color : \"color-mix(in oklab, var(--bg) 50%, transparent)\",\n            fg: sel ? \"var(--onAccent)\" : \"var(--muted)\",\n            border: sel ? s.color : \"color-mix(in oklab, var(--accent) 22%, transparent)\",\n            glow: sel ? \"0 0 14px \" + s.color : \"none\"\n          };\n        })\n      };\n    });\n  }\n\n  cardRows() {\n    const rows = [];\n    const push = (list, offset) => list.forEach((q, i) => {\n      rows.push({ n: String(offset + i + 1), icon: q[0], text: q[1] });\n    });\n    push(UK, 0);\n    push(WORLD, UK.length);\n    return rows;\n  }\n\n  // One-time pad: each answer is masked with a fresh random value, so the\n  // mosaic carries the ciphertext only — unreadable without the pad.\n  cipherCells() {\n    const pad = this.state.pad;\n    const cells = [];\n    let k = 0;\n    [\"u\", \"w\"].forEach(p => (p === \"u\" ? UK : WORLD).forEach((_, i) => {\n      const v = this.state.vote[p + i];\n      for (let b = 0; b < 5; b++) {\n        const plain = v === undefined ? 0 : (v + 2) * 7 + b * 3;\n        const c = (plain ^ pad[k % pad.length]) & 0xff;\n        k++;\n        const shade = 30 + (c % 200);\n        cells.push({ bg: \"rgb(\" + shade + \",\" + shade + \",\" + shade + \")\" });\n      }\n    }));\n    return cells;\n  }\n\n  // FNV-1a over every answer slot + the pad — a stable 6-char fingerprint\n  // of this exact card. Unanswered slots count as \"-\", so it always differs.\n  seal() {\n    let h = 0x811c9dc5;\n    const feed = n => { h ^= n & 0xff; h = (h * 0x01000193) >>> 0; };\n    [\"u\", \"w\"].forEach(p => (p === \"u\" ? UK : WORLD).forEach((_, i) => {\n      const v = this.state.vote[p + i];\n      feed(v === undefined ? 45 : 65 + v + 2);\n    }));\n    this.state.pad.slice(0, 8).forEach(feed);\n    return h.toString(36).toUpperCase().padStart(6, \"0\").slice(-6);\n  }\n\n  drawQR() {\n    const el = this.qrEl;\n    if (!el || typeof qrMatrix === \"undefined\") {\n      if (el) { clearTimeout(this._qrT); this._qrT = setTimeout(() => this.drawQR(), 300); }\n      return;\n    }\n    if (el.dataset.done) return;\n    const m = qrMatrix(\"https://planetarycouncil.org/vote\");\n    const n = m.length;\n    el.style.gridTemplateColumns = \"repeat(\" + n + \",1fr)\";\n    el.innerHTML = \"\";\n    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {\n      const d = document.createElement(\"div\");\n      d.style.background = m[y][x] ? \"#111\" : \"#fff\";\n      el.appendChild(d);\n    }\n    el.dataset.done = \"1\";\n  }\n\n  renderVals() {\n    const keys = Object.keys(this.state.vote);\n    const count = keys.length;\n    let sum = 0;\n    keys.forEach(k => sum += this.state.vote[k]);\n    const dots = [];\n    [\"u\", \"w\"].forEach(p => (p === \"u\" ? UK : WORLD).forEach((_, i) => {\n      const v = this.state.vote[p + i];\n      const s = SCALE.find(x => x.v === v);\n      dots.push({ bg: s ? s.color : \"color-mix(in oklab, var(--muted) 16%, transparent)\" });\n    }));\n    return {\n      scaleHeads: SCALE.map(s => s.label),\n      scaleMarks: SCALE.map(s => s.mark),\n      uk: this.buildQs(\"u\", UK),\n      world: this.buildQs(\"w\", WORLD),\n      cardRows: this.cardRows(),\n      cipher: this.cipherCells(),\n      qrRef: el => { this.qrEl = el; },\n      padId: this.state.pad.slice(0, 4).map(b => b.toString(16).toUpperCase().padStart(2, \"0\")).join(\"\"),\n      stamp: new Date().toUTCString().replace(\" GMT\", \" GMT\"),\n      dots,\n      tally: count + \"/\" + TOTAL,\n      pct: Math.round((count / TOTAL) * 100) + \"%\",\n      cardId: this.seal(),\n      clacton: CLACTON.map((text, i) => ({\n        n: String(i + 1), text,\n        on: !!this.state.on[\"c\" + i],\n        toggle: () => this.setState(s => ({ on: Object.assign({}, s.on, { [\"c\" + i]: !s.on[\"c\" + i] }) }))\n      })),\n      legacy: LEGACY,\n      legacyOn: !!this.state.on.legacy,\n      toggleLegacy: () => this.setState(s => ({ on: Object.assign({}, s.on, { legacy: !s.on.legacy }) })),\n      clactonOpen: this.state.clactonOpen,\n      classicsOpen: this.state.classicsOpen,\n      clactonCaret: this.state.clactonOpen ? \"−\" : \"+\",\n      classicsCaret: this.state.classicsOpen ? \"−\" : \"+\",\n      toggleClacton: () => this.setState(s => ({ clactonOpen: !s.clactonOpen })),\n      toggleClassics: () => this.setState(s => ({ classicsOpen: !s.classicsOpen })),\n      clearAll: () => this.setState({ vote: {}, on: {} }),\n      debug: this.state.debug,\n      panelOpen: this.state.panelOpen,\n      panelCaret: this.state.panelOpen ? \"−\" : \"+\",\n      togglePanel: () => this.setState(s => ({ panelOpen: !s.panelOpen })),\n      seed: this.state.seed || \"default\",\n      swatches: VARS.map(k => ({ name: k, value: this.state.theme[k] })),\n      themeJson: JSON.stringify(this.state.theme, null, 1),\n      selectAll: e => e.target.select(),\n      shuffle: () => {\n        const seed = Math.floor(Math.random() * 99999);\n        this.setState({ seed, theme: nudgeTheme(seed, 0.2) });\n      },\n      shuffleWild: () => {\n        const seed = Math.floor(Math.random() * 99999);\n        this.setState({ seed, theme: makeTheme(seed) });\n      },\n      resetTheme: () => this.setState({ seed: 0, theme: DEFAULT_THEME })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
